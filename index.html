<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- SPEC LR-6: no inline script, no third-party origin. 'wasm-unsafe-eval' compiles the
     module; 'unsafe-inline' for styles is needed by eframe's canvas sizing. frame-ancestors
     cannot be set from a <meta> tag (browsers ignore it and log an error), so it is absent. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Pokyxel</title>
<!-- Installable web app (SPEC WP-G6): the manifest and icons are files of this site, and
     manifest-src falls back to default-src 'self', so the CSP above is unchanged. The
     rel value "apple-touch-icon" is the platform's own key for the home-screen icon. -->
<meta name="theme-color" content="#17181b" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- The manifest lists no maskable icon (tablet report, SPEC § 12 2026-10-29): an Android
     browser that builds a web-app shortcut from a maskable icon showed a blank one. The
     sized links below serve a plain bookmark shortcut, which reads the page's own icons. -->
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
<link rel="icon" href="./icons/icon-512.png" type="image/png" sizes="512x512" />
<link rel="apple-touch-icon" href="./icons/touch-icon-180.png" />
<!-- The two OFL families, served from this site (SPEC § 2 "Fonts"). Preloaded so they
     download in parallel with the module; the app fetches the same URLs and hits this
     cache. `crossorigin` is required for font preloads to be reused by fetch(). -->
<link rel="preload" href="./fonts/HankenGrotesk-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="preload" href="./fonts/HankenGrotesk-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
<link rel="preload" href="./fonts/JetBrainsMono-Regular.ttf" as="font" type="font/ttf" crossorigin />
<style>
  /* SPEC WP-U5: the browser must not pan, zoom, select, show a callout or pull to refresh on
     the canvas; the app owns every gesture (eframe's document-level touchmove listener is
     passive, so only CSS can keep the browser out). */
  html, body { margin: 0; height: 100%; background: #17181b; color: #d7dae0;
               font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none;
           user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #pokyxel-crash { position: absolute; inset: 0; display: grid; place-content: center;
                   justify-items: center; gap: 12px; padding: 24px; text-align: center;
                   background: #17181b; color: #d7dae0; }
  #pokyxel-crash[hidden] { display: none; }
  #pokyxel-crash p { margin: 0; max-width: 32em; }
  #pokyxel-crash pre { margin: 0; max-width: 90vw; max-height: 30vh; overflow: auto;
                       text-align: left; font-size: 12px; white-space: pre-wrap; }
  #pokyxel-crash a { color: #d9c98c; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
</style>
</head>
<body>
<!-- The whole UI is drawn by the Rust app into this canvas (eframe + WebGL2). -->
<canvas id="pokyxel-canvas"></canvas>
<!-- Shown by the panic hook in pokyxel-shell; no script involved (SPEC WP-G1). -->
<div id="pokyxel-crash" hidden role="alert">
  <p>Pokyxel hit an internal error and stopped. Your last autosave is kept. Reload the page to continue.</p>
  <a href="">Reload</a>
</div>
<noscript>Pokyxel is a WebAssembly application and needs JavaScript enabled to load its module.</noscript>
<!-- The first of the two hand-written JavaScript files (SPEC § 2, "Web build tooling");
     the other is the service worker sw.js, which pokyxel-shell registers (WP-G6). -->
<script type="module" src="./boot.js"></script>
</body>
</html>
